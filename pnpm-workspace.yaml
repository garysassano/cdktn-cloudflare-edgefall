packages:
  - "."

# Miniflare pins a vulnerable libheif build. Remove after upstream adopts sharp >=0.35.4.
overrides:
  "miniflare>sharp": "0.35.4"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@playwright/test@1.63.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0
  - playwright@1.63.0
  - playwright-core@1.63.0

# mise owns the package-manager binary.
pmOnFail: ignore
